# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Unit build, test, coverage
        run: |
          docker run --rm --init --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/ws" -w /ws --shm-size=1g \
            -e DISPLAY= -e LIBGL_ALWAYS_SOFTWARE=1 -e LIBGL_DRI3_DISABLE=1 \
            ros:lyrical-ros-base@sha256:3224ee150cb02eb89a5e0811bc267b57ed3a91b9c10191df57810726a7e916d7 \
            bash -lc 'set -eo pipefail
              export AMENT_TRACE_SETUP_FILES=
              source /opt/ros/lyrical/setup.bash
              apt-get update -qq
              apt-get install -y -qq python3-venv \
                ros-lyrical-ament-cmake ros-lyrical-ament-cmake-auto \
                ros-lyrical-ament-cmake-gtest \
                ros-lyrical-rclcpp ros-lyrical-nav-msgs ros-lyrical-sensor-msgs \
                ros-lyrical-geometry-msgs ros-lyrical-std-msgs
              source /opt/ros/lyrical/setup.bash
              rm -rf build install log
              python3 -m venv /ws/.venv
              /ws/.venv/bin/pip install --no-cache-dir -r /ws/requirements-ci.txt
              /ws/.venv/bin/pip download gcovr==8.8 -d /tmp/gcovr-dl --no-deps
              echo "expected gcovr wheel sha256:a5c3e3d4a9c8ab4a95aa8e4b072fcaec7962b1d9fb2add3f10645f649ef29545"
              sha256sum /tmp/gcovr-dl/*
              /ws/.venv/bin/python -c "import importlib.metadata as m; assert m.version(\"gcovr\")==\"8.8\""
              colcon build --packages-select grc_robot \
                --cmake-args -DCMAKE_BUILD_TYPE=Debug \
                "-DCMAKE_CXX_FLAGS=--coverage" \
                "-DCMAKE_EXE_LINKER_FLAGS=--coverage"
              source install/setup.bash
              colcon test --packages-select grc_robot --event-handlers console_direct+
              colcon test-result --verbose
              /ws/.venv/bin/gcovr --root /ws --gcov-ignore-parse-errors \
                --filter "src/grc_robot/src/follower.cpp" \
                --filter "src/grc_robot/src/safety_stop.cpp" \
                --filter "src/grc_robot/include/grc_robot/follower.hpp" \
                --filter "src/grc_robot/include/grc_robot/safety_stop.hpp" \
                --fail-under-line 80 --html-details -o /ws/coverage.html
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage
          path: coverage.html

  sim:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Sim scenarios
        run: |
          docker run --rm --init --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/ws" -w /ws --shm-size=1g \
            -e DISPLAY= -e LIBGL_ALWAYS_SOFTWARE=1 -e LIBGL_DRI3_DISABLE=1 \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            -e GITHUB_SERVER_URL="${{ github.server_url }}" \
            -e GRC_ARTIFACTS_DIR=/ws/artifacts \
            ros:lyrical-ros-base@sha256:3224ee150cb02eb89a5e0811bc267b57ed3a91b9c10191df57810726a7e916d7 \
            bash -lc 'set -eo pipefail
              export AMENT_TRACE_SETUP_FILES=
              source /opt/ros/lyrical/setup.bash
              apt-get update -qq
              apt-get install -y -qq ros-lyrical-ros-gz ros-lyrical-ros-gz-sim \
                ros-lyrical-ros-gz-bridge ros-lyrical-ros-gz-interfaces \
                ros-lyrical-launch-testing ros-lyrical-launch-testing-ament-cmake \
                ros-lyrical-launch-testing-ros ros-lyrical-ament-cmake-gtest python3-pytest \
                ros-lyrical-gz-sim-vendor ros-lyrical-gz-sensors-vendor \
                libegl-mesa0 libgl1-mesa-dri libgl1
              echo "GZ sim system libs:" && (find /opt/ros/lyrical -name 'libgz-sim-*-system.so' 2>/dev/null | head -40 || true)
              source /opt/ros/lyrical/setup.bash
              rm -rf build install log
              colcon build --packages-up-to grc_bringup --cmake-args -DCMAKE_BUILD_TYPE=Release
              source install/setup.bash
              export GZ_SIM_RESOURCE_PATH=/ws/install/grc_robot/share/grc_robot/models
              export GZ_SIM_SYSTEM_PLUGIN_PATH=/opt/ros/lyrical/lib:/opt/ros/lyrical/opt/gz_sim_vendor/lib:/opt/ros/lyrical/opt/gz_plugins_vendor/lib:/opt/ros/lyrical/opt/gz_sensors_vendor/lib
              export GZ_PLUGIN_PATH=$GZ_SIM_SYSTEM_PLUGIN_PATH
              colcon test --packages-select grc_bringup --executor sequential \
                --event-handlers console_direct+
              colcon test-result --verbose
              ros2 run grc_bringup write_report.py
              ros2 run grc_bringup write_badge.py
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sim-artifacts
          path: |
            artifacts/
            log/

  web:
    needs: [sim]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sim-artifacts
          path: artifacts
      - name: Build and test web
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          REPORT=$(find ../artifacts -name ci-report.json -print -quit)
          BADGE=$(find ../artifacts -name badge.svg -print -quit)
          test -n "$REPORT" && test -n "$BADGE"
          cp "$REPORT" dist/ci-report.json
          cp "$BADGE" dist/badge.svg
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-dist
          path: |
            web/dist
            docs/demo.png

  pages:
    needs: [unit, sim, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-dist
          path: _pages_staging
      - name: Select Pages site directory
        run: |
          set -euo pipefail
          if [ -f _pages_staging/web/dist/index.html ]; then
            mv _pages_staging/web/dist site
          elif [ -f _pages_staging/dist/index.html ]; then
            mv _pages_staging/dist site
          elif [ -f _pages_staging/index.html ]; then
            mv _pages_staging site
          else
            echo "index.html not found in web-dist artifact"
            find _pages_staging -maxdepth 4 -type f
            exit 1
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
